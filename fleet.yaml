# fleet.yaml — Fleet GitOps bundle definition
#
# IMPORTANT: Before adding any cluster to this bundle, run on that cluster:
#
#   kubectl apply -f alien-geeko-manifest.yaml
#
# This pre-creates the Namespace with the correct Helm ownership labels so
# Fleet's internal Helm engine does not attempt to create or import it,
# avoiding "namespace already exists" and "invalid ownership metadata" errors.
#
# Documentation: https://fleet.rancher.io/ref-fleet-yaml

# defaultNamespace — fallback for any resource without an explicit namespace.
# Does NOT enforce namespace restriction, so cluster-scoped resources
# (ClusterRole, ClusterRoleBinding) are allowed through unmodified.
defaultNamespace: alien-geeko

targets:
  # ARM Pi cluster — overlay sets CLUSTER_NAME for Pi nodes.
  # demo=true is required on ALL targets — a cluster without this label
  # will not match any target and receives nothing.
  - name: pi-arm-cluster
    clusterSelector:
      matchLabels:
        demo: "true"
        edge-type: pi-cluster
        kubernetes.io/arch: arm64
    kustomize:
      dir: overlays/pi-cluster

  # x86 cluster — overlay sets CLUSTER_NAME for x86 nodes
  - name: x86-cluster
    clusterSelector:
      matchLabels:
        demo: "true"
        edge-type: x86-cluster
    kustomize:
      dir: overlays/x86-cluster

  # Generic demo cluster — no overlay, uses default CLUSTER_NAME from ConfigMap.
  # Matches any cluster with demo=true that did not match the specific targets above.
  - name: all-demo-clusters
    clusterSelector:
      matchLabels:
        demo: "true"

  # ── NO FALLBACK ────────────────────────────────────────────────────────────
  # There is intentionally no target with clusterSelector: {} here.
  # Any cluster without demo=true matches nothing and gets nothing.
