# fleet.yaml — Fleet GitOps bundle definition
# Documentation: https://fleet.rancher.io/ref-fleet-yaml

defaultNamespace: alien-geeko

helm:
  # takeOwnership allows Fleet's Helm engine to adopt the alien-geeko namespace
  # even if it was pre-created (e.g., by a previous install attempt).
  # This prevents "invalid ownership metadata" errors on re-deploy.
  takeOwnership: true

targets:
  - name: pi-arm-cluster
    clusterSelector:
      matchLabels:
        demo: "true"
        edge-type: pi-cluster
        kubernetes.io/arch: arm64
    kustomize:
      dir: overlays/pi-cluster

  - name: x86-cluster
    clusterSelector:
      matchLabels:
        demo: "true"
        edge-type: x86-cluster
    kustomize:
      dir: overlays/x86-cluster

  - name: all-demo-clusters
    clusterSelector:
      matchLabels:
        demo: "true"
