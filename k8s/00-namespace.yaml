# 00-namespace.yaml — Namespace definition for alien-geeko
#
# Fleet's internal Helm engine manages this namespace. The takeOwnership: true
# flag in fleet.yaml ensures Fleet adopts it even if it pre-exists on a cluster.
# The Helm ownership labels and annotations are kept here for correctness but
# takeOwnership makes manual pre-creation unnecessary.

apiVersion: v1
kind: Namespace
metadata:
  name: alien-geeko
  labels:
    app.kubernetes.io/name: alien-geeko
    app.kubernetes.io/part-of: suse-edge-demo
    app.kubernetes.io/managed-by: Helm
    # Pod Security Admission — required for RKE2 which enforces PSA by default.
    # "baseline" allows our non-root, no-privilege container.
    # "warn: restricted" surfaces warnings if a sidecar needs relaxing.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  annotations:
    # Helm ownership — must match the Fleet bundle name and namespace.
    meta.helm.sh/release-name: alien-geeko
    meta.helm.sh/release-namespace: alien-geeko
