# 03-configmap.yaml — Per-cluster and cluster-info ConfigMaps

---
# Per-cluster configuration — override CLUSTER_NAME via Fleet overlays.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alien-geeko-config
  namespace: alien-geeko
  labels:
    app.kubernetes.io/name: alien-geeko
    app.kubernetes.io/part-of: suse-edge-demo
data:
  # Default cluster name — overridden per cluster in Fleet overlays.
  # e.g. "PI-CLUSTER-01", "X86-FACTORY-EDGE", "ARM-RETAIL-SITE-042"
  CLUSTER_NAME: "EDGE-CLUSTER"

---
# Cluster info configmap — values detected at runtime by the application.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alien-geeko-cluster-info
  namespace: alien-geeko
  labels:
    app.kubernetes.io/name: alien-geeko
    app.kubernetes.io/part-of: suse-edge-demo
data:
  K8S_VERSION: "detecting..."
  NODE_COUNT: "?"
  NODE_ARCH: "amd64"
  OS_RELEASE: "SUSE Linux Micro"
